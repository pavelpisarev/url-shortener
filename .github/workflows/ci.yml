name: Root CI

"on":
  push:
    branches:
      - main
    # Tags are needed by images/release jobs with "v*" tag
    tags:
      - 'v*'
  pull_request:
  # Manual run from the Actions tab (only appears after merge into main)
  workflow_dispatch:

# Minimal permissions by default
permissions:
  contents: read

# One run per ref. A new push to a PR cancels the previous run,
# while pushes to main and tags are not cancelled to avoid interrupting a release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml

  # End-to-end check against the real compose stack: builds both images,
  # waits for migrations and verifies link creation, redirect and click stats
  smoke:
    name: Smoke
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Cold image builds dominate the runtime here
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Compose interpolates the root .env; it is gitignored, so copy the example
      - name: Prepare env
        run: cp .env.example .env

      # No --wait: the migrate service is one-shot and would never be "running"
      - name: Start stack
        run: docker compose --env-file .env -f docker/docker-compose.yml up -d --build

      # The script has its own readiness timeouts for frontend and backend
      - name: Run smoke
        run: bash scripts/smoke.sh

      - name: Stack logs
        if: failure()
        run: docker compose --env-file .env -f docker/docker-compose.yml logs --tail=200

      # Always tear down to free the runner; || true because the stack may not have started
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose.yml down -v || true

  # Builds and pushes the backend image to GHCR
  # Skipped on pull requests: Dockerfiles are already validated by the smoke job
  publish-backend:
    name: Publish backend
    needs: [backend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level permissions replace the top-level block, so contents is repeated
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-short on every run, semver tags only when the ref is a v* tag
      # No latest: an image should be traceable to a commit or a release
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Context and file mirror docker/docker-compose.yml, where the context is ../backend
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./docker/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # Builds and pushes the frontend image to GHCR
  # Skipped on pull requests: Dockerfiles are already validated by the smoke job
  publish-frontend:
    name: Publish frontend
    needs: [frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Context and file mirror docker/docker-compose.yml, where the context is ../frontend
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./docker/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Creates a GitHub Release once both images for a v* tag are published
  # and the full stack passed smoke
  release:
    name: Release
    needs: [publish-backend, publish-frontend, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Idempotent: re-running the job for an already released tag does not fail
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
