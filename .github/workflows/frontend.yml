name: Frontend CI

"on":
  # Runs only as a reusable workflow from root ci.yml, never triggered on its own
  workflow_call: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The timeout is set here: the caller (a job with uses:) rejects this field
    timeout-minutes: 10
    # All run steps execute from frontend/, so commands need no prefix.
    # checkout and setup-node are unaffected: working-directory applies to run steps only
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 26 matches the node:26-alpine builder in docker/frontend/Dockerfile.
      # cache-dependency-path is explicit because package-lock.json lives outside
      # the repository root; cache: npm stores the shared npm cache between runs
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs strictly from the lockfile and fails when it is out of sync
      - name: Install dependencies
        run: npm ci

      # oxlint over sources and configs
      - name: Lint
        run: npm run lint

      # Vitest in single-run mode (no watch)
      - name: Test
        run: npm test

      # tsc -b + vite build: fails on type errors and produces dist/ for the image
      - name: Build
        run: npm run build
