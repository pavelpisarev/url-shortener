server {
    # Listen on port 80 for HTTP requests
    listen 80;
    # Set the server name to catch all requests
    server_name _;
    # Set the root directory for serving files
    root /usr/share/nginx/html;
    # Set the default index file to serve
    index index.html;
    sendfile on;

    # Enable gzip compression for specific content types to improve performance
    gzip on;
    # Specify the content types that should be compressed
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Define a location block for the /healthz endpoint to provide a health check
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Define a location block for serving static assets with caching headers
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Define a location block for serving the index.html file with no caching
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Define a location block for all other requests to serve the index.html file
    location / {
        try_files $uri $uri/ /index.html;
    }
}